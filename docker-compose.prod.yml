services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_backup:
    image: postgres:16
    profiles: ["tools"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]

  db_restore:
    image: postgres:16
    profiles: ["tools"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      RESTORE_FILE: ${RESTORE_FILE:-}
      POSTGRES_RESTORE_DB: ${POSTGRES_RESTORE_DB:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      ALLOW_PRODUCTION_RESTORE: ${ALLOW_PRODUCTION_RESTORE:-0}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./app/media:/app/media
      - ./app/staticfiles:/app/staticfiles
    environment:
      DEBUG: "0"
      LOG_DIR: ${LOG_DIR:-/logs}
    expose:
      - "8000"
    depends_on:
      - db
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120}

  mitre_scheduler:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./app/media:/app/media
      - ./app/staticfiles:/app/staticfiles
    environment:
      DEBUG: "0"
      LOG_DIR: ${LOG_DIR:-/logs}
      MITRE_SYNC_POLL_SECONDS: ${MITRE_SYNC_POLL_SECONDS:-3600}
    depends_on:
      - db
    healthcheck:
      disable: true
    command: python manage.py run_mitre_scheduler

  server_inventory_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./app/media:/app/media
      - ./app/staticfiles:/app/staticfiles
    environment:
      DEBUG: "0"
      LOG_DIR: ${LOG_DIR:-/logs}
    depends_on:
      - db
    healthcheck:
      disable: true
    command: python manage.py run_server_inventory_worker

volumes:
  postgres_data:
