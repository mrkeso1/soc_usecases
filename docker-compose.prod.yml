services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./app/media:/app/media
      - ./app/staticfiles:/app/staticfiles
    environment:
      DEBUG: "0"
      LOG_DIR: ${LOG_DIR:-/logs}
    expose:
      - "8000"
    depends_on:
      - db
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120}

  mitre_scheduler:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ./app/media:/app/media
      - ./app/staticfiles:/app/staticfiles
    environment:
      DEBUG: "0"
      LOG_DIR: ${LOG_DIR:-/logs}
      MITRE_SYNC_POLL_SECONDS: ${MITRE_SYNC_POLL_SECONDS:-3600}
    depends_on:
      - db
    command: python manage.py run_mitre_scheduler

volumes:
  postgres_data:
