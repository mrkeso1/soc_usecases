services:
  # docker-compose.yml es solo para desarrollo local.
  # En entornos compartidos usa docker-compose.prod.yml y un reverse proxy.
  db:
    image: postgres:16
    container_name: soc_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
    ports:
      - "8000:8000"
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: python manage.py runserver 0.0.0.0:8000

  mitre_scheduler:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_mitre_scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
      MITRE_SYNC_POLL_SECONDS: ${MITRE_SYNC_POLL_SECONDS:-3600}
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      disable: true
    command: python manage.py run_mitre_scheduler

volumes:
  postgres_data:
