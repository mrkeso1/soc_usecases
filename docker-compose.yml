services:
  db:
    image: postgres:16
    container_name: soc_db
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    cpus: "1.0"
    pids_limit: 200
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  db_backup:
    image: postgres:16
    profiles:
      - tools
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    networks:
      - internal
    entrypoint:
      - /bin/sh
      - /scripts/backup.sh

  db_restore:
    image: postgres:16
    profiles:
      - tools
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      RESTORE_FILE: ${RESTORE_FILE:-}
      POSTGRES_RESTORE_DB: ${POSTGRES_RESTORE_DB:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      ALLOW_PRODUCTION_RESTORE: ${ALLOW_PRODUCTION_RESTORE:-0}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    networks:
      - internal
    entrypoint:
      - /bin/sh
      - /scripts/restore.sh

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_web
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "1.5"
    pids_limit: 250
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - db
    networks:
      - internal
      - web
    command: python manage.py runserver 0.0.0.0:8000

  mitre_scheduler:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_mitre_scheduler
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.75"
    pids_limit: 150
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
      MITRE_SYNC_POLL_SECONDS: ${MITRE_SYNC_POLL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - db
    healthcheck:
      disable: true
    networks:
      - internal
    command: python manage.py run_mitre_scheduler

  server_inventory_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_server_inventory_worker
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 200
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - db
    healthcheck:
      disable: true
    networks:
      - internal
    command: python manage.py run_server_inventory_worker

networks:
  internal:
    driver: bridge

  web:
    external: true

volumes:
  postgres_data:
