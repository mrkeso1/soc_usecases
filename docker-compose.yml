services:
  # docker-compose.yml es solo para desarrollo local.
  # En entornos compartidos usa docker-compose.prod.yml y un reverse proxy.
  db:
    image: postgres:16
    container_name: soc_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_backup:
    image: postgres:16
    profiles: ["tools"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]

  db_restore:
    image: postgres:16
    profiles: ["tools"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      RESTORE_FILE: ${RESTORE_FILE:-}
      POSTGRES_RESTORE_DB: ${POSTGRES_RESTORE_DB:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      ALLOW_PRODUCTION_RESTORE: ${ALLOW_PRODUCTION_RESTORE:-0}
    volumes:
      - ./backups:/backups
      - ./docker/postgres:/scripts:ro
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  mitre_scheduler:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_mitre_scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
      MITRE_SYNC_POLL_SECONDS: ${MITRE_SYNC_POLL_SECONDS:-3600}
    depends_on:
      - db
    healthcheck:
      disable: true
    command: python manage.py run_mitre_scheduler

  server_inventory_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: soc_server_inventory_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      LOG_DIR: ${LOG_DIR:-/logs}
    depends_on:
      - db
    healthcheck:
      disable: true
    command: python manage.py run_server_inventory_worker

volumes:
  postgres_data:
