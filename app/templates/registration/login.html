<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - SOC Use Cases</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .errorlist {
            color: #fca5a5;
            padding-left: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>SOC Use Cases</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <label for="id_username">Usuario</label>
            {{ form.username }}

            <label for="id_password">Contraseña</label>
            {{ form.password }}

            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
