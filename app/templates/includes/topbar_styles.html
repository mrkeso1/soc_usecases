{% load static %}
<script>
    (function () {
        const storedTheme = localStorage.getItem('soc-theme');
        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = storedTheme || (prefersLight ? 'light' : 'dark');
    })();
</script>
<script src="{% static 'vendor/htmx.min.js' %}" defer></script>
<script src="{% static 'vendor/alpine.min.js' %}" defer></script>
<script src="{% static 'vendor/lucide.min.js' %}" defer></script>
<script src="{% static 'js/soc-ui.js' %}" defer></script>
<style>
    :root {
        --bg: #080b10;
        --surface: #11151c;
        --surface-2: #171d26;
        --surface-3: #202836;
        --surface-elevated: #0d1117;
        --control: #151b24;
        --border: rgba(187, 203, 224, 0.13);
        --border-bright: rgba(80, 160, 255, 0.42);
        --text: #d6deea;
        --text-strong: #f5f8fc;
        --text-muted: #93a4ba;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-dim: rgba(37, 99, 235, 0.16);
        --accent-glow: rgba(37, 99, 235, 0.22);
        --good: #10b981;
        --good-dim: rgba(16, 185, 129, 0.14);
        --medium: #f59e0b;
        --medium-dim: rgba(245, 158, 11, 0.14);
        --bad: #ef4444;
        --bad-dim: rgba(239, 68, 68, 0.14);
        --grid-color: rgba(94, 126, 166, 0.055);
        --shell-radius: 8px;
        --shadow-soft: 0 18px 48px rgba(0, 0, 0, 0.18);
    }

    html[data-theme="light"] {
        --bg: #f3f6fb;
        --surface: #ffffff;
        --surface-2: #eef3f9;
        --surface-3: #dce7f3;
        --surface-elevated: #ffffff;
        --control: #ffffff;
        --border: rgba(34, 59, 92, 0.18);
        --border-bright: rgba(37, 99, 235, 0.42);
        --text: #25364a;
        --text-strong: #0f1f33;
        --text-muted: #526880;
        --accent: #1d5fd4;
        --accent-hover: #164eb4;
        --accent-dim: rgba(29, 95, 212, 0.13);
        --accent-glow: rgba(29, 95, 212, 0.16);
        --good: #047857;
        --good-dim: rgba(4, 120, 87, 0.12);
        --medium: #9a6500;
        --medium-dim: rgba(154, 101, 0, 0.13);
        --bad: #b4232d;
        --bad-dim: rgba(180, 35, 45, 0.12);
        --grid-color: rgba(35, 65, 104, 0.065);
        --shadow-soft: 0 18px 48px rgba(20, 40, 70, 0.10);
    }

    html,
    body {
        background: var(--bg);
        color: var(--text);
    }

    body::before {
        opacity: 1;
    }

    html[data-theme="light"] body::before {
        opacity: 0.75;
    }

    .topbar {
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
        min-height: 62px !important;
        display: flex !important;
        align-items: center !important;
        gap: 16px !important;
        padding: 0 22px !important;
        border-bottom: 1px solid var(--border) !important;
        background:
            linear-gradient(90deg, rgba(37, 99, 235, 0.075), transparent 38%),
            color-mix(in srgb, var(--surface-elevated) 94%, transparent) !important;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14) !important;
        backdrop-filter: blur(12px);
    }

    .brand {
        min-width: 230px !important;
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        color: var(--text-strong) !important;
        letter-spacing: 0 !important;
    }

    .brand-main {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 11px;
        color: inherit;
        text-decoration: none;
    }

    .brand-icon {
        width: 34px !important;
        height: 34px !important;
        flex: 0 0 34px !important;
        display: grid !important;
        place-items: center !important;
        border: 1px solid var(--border-bright) !important;
        border-radius: var(--shell-radius) !important;
        color: #ffffff !important;
        background: var(--accent) !important;
        box-shadow: 0 0 0 4px var(--accent-dim) !important;
    }

    .brand-icon svg {
        width: 18px !important;
        height: 18px !important;
        fill: currentColor !important;
    }

    .brand-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .brand-copy strong {
        overflow: hidden;
        color: var(--text-strong);
        font-size: 12px;
        font-weight: 850;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .brand-copy small {
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 700;
    }

    .shell-menu-button,
    .mobile-shell-bar,
    .shell-scrim {
        display: none !important;
    }

    .shell-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(16, 185, 129, 0.24);
        border-radius: var(--shell-radius);
        color: var(--text);
        background: var(--good-dim);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 750;
        white-space: nowrap;
    }

    .shell-status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.55);
    }

    .topbar-nav {
        min-width: 0 !important;
        display: flex !important;
        align-items: center !important;
        gap: 4px !important;
        flex: 1 1 auto !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        padding: 6px 2px !important;
        scrollbar-width: thin;
    }

    .nav-label,
    .nav-icon {
        display: none !important;
    }

    .topbar-nav a {
        min-height: 34px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: 0 0 auto !important;
        padding: 0 11px !important;
        border: 1px solid transparent !important;
        border-radius: var(--shell-radius) !important;
        color: var(--text-muted) !important;
        background: transparent !important;
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        font-size: 11px !important;
        font-weight: 800 !important;
        line-height: 1 !important;
        letter-spacing: 0 !important;
        text-decoration: none !important;
        white-space: nowrap !important;
    }

    .topbar-nav a:hover,
    .topbar-nav a.active {
        color: var(--text-strong) !important;
        border-color: var(--border) !important;
        background: var(--surface-2) !important;
    }

    .topbar-nav a.active {
        color: var(--accent) !important;
        border-color: rgba(37, 99, 235, 0.28) !important;
        background: var(--accent-dim) !important;
    }

    .topbar-footer {
        display: flex !important;
        align-items: center !important;
        gap: 7px !important;
        flex: 0 0 auto !important;
    }

    .theme-toggle-button,
    .admin-link,
    .topbar-logout-button {
        min-height: 34px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 11px !important;
        border: 1px solid var(--border) !important;
        border-radius: var(--shell-radius) !important;
        color: var(--text) !important;
        background: var(--surface-2) !important;
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        font-size: 11px !important;
        font-weight: 800 !important;
        line-height: 1 !important;
        text-decoration: none !important;
        white-space: nowrap !important;
        cursor: pointer !important;
    }

    .theme-toggle-button:hover,
    .admin-link:hover,
    .topbar-logout-button:hover {
        color: var(--text-strong) !important;
        border-color: var(--border-bright) !important;
        background: var(--surface-3) !important;
    }

    .topbar-logout-form {
        display: inline-flex !important;
        align-items: center !important;
        margin: 0 !important;
    }

    .htmx-indicator {
        opacity: 0;
        transition: opacity 0.15s ease;
    }

    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator {
        opacity: 1;
    }

    .soc-notification-stack {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 3000;
        display: grid;
        width: min(430px, calc(100vw - 32px));
        max-height: min(70vh, 560px);
        gap: 10px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
    }

    .soc-notification {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        padding: 12px 14px;
        border: 1px solid var(--border-bright);
        border-radius: 10px;
        color: var(--text-strong);
        background: var(--surface-elevated);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .soc-notification.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .soc-notification-indicator {
        align-self: stretch;
        min-height: 36px;
        border-radius: 999px;
        background: var(--accent);
    }

    .soc-notification.success .soc-notification-indicator {
        background: var(--good);
    }

    .soc-notification.warning .soc-notification-indicator {
        background: var(--medium);
    }

    .soc-notification.error .soc-notification-indicator {
        background: var(--bad);
    }

    .soc-notification-copy {
        min-width: 0;
    }

    .soc-notification-title {
        display: block;
        margin-bottom: 3px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .soc-notification-copy p {
        margin: 0;
        color: var(--text);
        font-size: 13px;
        line-height: 1.42;
        overflow-wrap: anywhere;
    }

    .soc-notification-close {
        display: inline-grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--text-muted);
        background: transparent;
        font: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
    }

    .soc-notification-close:hover,
    .soc-notification-close:focus-visible {
        border-color: var(--border-bright);
        color: var(--text-strong);
        background: var(--surface-3);
        outline: none;
    }

    @media (max-width: 640px) {
        .soc-notification-stack {
            right: 12px;
            bottom: 12px;
            width: calc(100vw - 24px);
        }
    }

    .container,
    .page-shell {
        margin-left: auto;
        margin-right: auto;
    }

    .page-header h1,
    .page-title,
    h1 {
        color: var(--text-strong);
        letter-spacing: 0 !important;
    }

    .breadcrumb,
    .page-subtitle,
    .summary-label,
    .summary-note,
    .chip-label,
    .field label,
    .muted,
    .empty-state,
    .empty-note,
    .empty-value,
    .meta-label,
    .detail-label,
    .list-item-sub,
    .row-subtitle,
    .tactic-meta,
    .d3-category,
    .coverage-count,
    .owner-summary,
    .radial-card-title,
    .radial-sub,
    .legend {
        color: var(--text-muted) !important;
        opacity: 1 !important;
    }

    .filter-panel,
    .filters,
    .panel,
    .summary-card,
    .summary-chip,
    .radial-card,
    .card,
    .side-card,
    .table-wrap,
    .matrix-wrap,
    .coverage-row,
    .detail-card,
    .mapping-card,
    .history-row,
    .change-log-row,
    .form-shell,
    .section-card,
    .toolbar,
    .explain-box,
    .feedback-bar,
    .message {
        border-color: var(--border) !important;
        color: var(--text) !important;
    }

    input,
    select,
    textarea,
    .row-form select,
    .row-form textarea,
    .owner-select,
    .cell-select,
    .cell-input,
    .cell-date,
    .disabled-reason-input,
    .mapping-input {
        background: var(--control) !important;
        color: var(--text-strong) !important;
        border-color: var(--border) !important;
    }

    input::placeholder,
    textarea::placeholder {
        color: var(--text-muted) !important;
        opacity: 1 !important;
    }

    .btn,
    .btn-secondary,
    .btn-ghost,
    .mini-btn,
    .btn-tab,
    .btn-mini,
    .tab-link,
    .save-btn,
    .btn-save,
    .btn-filter,
    .btn-clear,
    .action-link {
        border-radius: 8px !important;
        letter-spacing: 0 !important;
    }

    .btn-primary,
    .btn-filter,
    .btn-save,
    .save-btn,
    .tab-link.active,
    .btn-tab.active {
        background: var(--accent) !important;
        border-color: var(--accent) !important;
        color: #ffffff !important;
    }

    .btn-primary:hover,
    .btn-filter:hover,
    .btn-save:hover,
    .save-btn:hover {
        background: var(--accent-hover) !important;
        border-color: var(--accent-hover) !important;
        color: #ffffff !important;
    }

    .status-chip,
    .badge,
    .mapping-chip,
    .technique-chip,
    .attack-chip {
        border-color: var(--border) !important;
    }

    .status-chip.good,
    .status-chip.enabled,
    .technique-chip.covered,
    .attack-chip.covered,
    .badge.good,
    .okb {
        background: var(--good-dim) !important;
        border-color: rgba(16, 185, 129, 0.35) !important;
        color: var(--good) !important;
    }

    .status-chip.medium,
    .status-chip.catalog,
    .badge.warn,
    .warn {
        background: var(--medium-dim) !important;
        border-color: rgba(245, 158, 11, 0.35) !important;
        color: var(--medium) !important;
    }

    .status-chip.bad,
    .status-chip.disabled,
    .technique-chip.missing,
    .attack-chip.missing,
    .badge.bad,
    .danger {
        background: var(--bad-dim) !important;
        border-color: rgba(239, 68, 68, 0.35) !important;
        color: var(--bad) !important;
    }

    .status-chip.fulfilled,
    .technique-chip.fulfilled,
    .badge.accent,
    .chip,
    .explain-icon {
        background: var(--accent-dim) !important;
        border-color: rgba(37, 99, 235, 0.35) !important;
        color: var(--accent) !important;
    }

    html[data-theme="light"] .filter-panel,
    html[data-theme="light"] .filters,
    html[data-theme="light"] .panel,
    html[data-theme="light"] .summary-card,
    html[data-theme="light"] .summary-chip,
    html[data-theme="light"] .radial-card,
    html[data-theme="light"] .card,
    html[data-theme="light"] .side-card,
    html[data-theme="light"] .table-wrap,
    html[data-theme="light"] .matrix-wrap,
    html[data-theme="light"] .coverage-row,
    html[data-theme="light"] .detail-card,
    html[data-theme="light"] .mapping-card,
    html[data-theme="light"] .history-row,
    html[data-theme="light"] .change-log-row,
    html[data-theme="light"] .form-shell,
    html[data-theme="light"] .section-card,
    html[data-theme="light"] .toolbar,
    html[data-theme="light"] .message {
        background: var(--surface) !important;
        box-shadow: 0 12px 28px rgba(15, 31, 51, 0.08) !important;
    }

    html[data-theme="light"] th,
    html[data-theme="light"] .tactic-header,
    html[data-theme="light"] thead th,
    html[data-theme="light"] tr th {
        background: var(--surface-2) !important;
        color: var(--text-muted) !important;
    }

    html[data-theme="light"] td,
    html[data-theme="light"] .list-item,
    html[data-theme="light"] .summary-row,
    html[data-theme="light"] .history-cell,
    html[data-theme="light"] .panel-row {
        border-color: var(--border) !important;
        color: var(--text) !important;
    }

    html[data-theme="light"] tr td {
        background: #ffffff !important;
    }

    html[data-theme="light"] tr:hover td {
        background: #eef3f9 !important;
    }

    html[data-theme="light"] .row-overdue td {
        background: #fff1f2 !important;
    }

    html[data-theme="light"] .row-soon td {
        background: #fff7e6 !important;
    }

    html[data-theme="light"] .autocomplete-results,
    html[data-theme="light"] .mapping-suggestions {
        background: #ffffff !important;
        border-color: var(--border) !important;
        box-shadow: 0 18px 38px rgba(15, 31, 51, 0.16) !important;
    }

    html[data-theme="light"] .autocomplete-item:hover {
        background: var(--surface-2) !important;
        color: var(--text-strong) !important;
    }

    @media (max-width: 1180px) {
        .topbar {
            flex-wrap: wrap !important;
            min-height: auto !important;
            padding: 10px 14px !important;
        }

        .brand {
            min-width: 0 !important;
            flex: 1 1 260px !important;
        }

        .shell-status {
            order: 3;
        }

        .topbar-nav {
            order: 4;
            flex-basis: 100% !important;
            padding: 2px 0 !important;
        }

        .topbar-footer {
            margin-left: auto;
        }
    }

    @media (max-width: 680px) {
        .topbar {
            gap: 10px !important;
        }

        .brand-copy small,
        .shell-status {
            display: none !important;
        }

        .topbar-footer {
            width: 100%;
            justify-content: flex-start !important;
            overflow-x: auto;
        }

        .topbar-nav a {
            min-height: 32px !important;
            padding: 0 9px !important;
            font-size: 10px !important;
        }

        .theme-toggle-button,
        .admin-link,
        .topbar-logout-button {
            min-height: 32px !important;
            font-size: 10px !important;
        }
    }
</style>
