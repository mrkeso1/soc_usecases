<style>
    .mitre-context-target { cursor:context-menu; }
    .mitre-context-popover { position:fixed; z-index:1000; display:none; width:min(440px, calc(100vw - 24px)); border:1px solid var(--border-bright); border-radius:14px; background:var(--surface); color:var(--text); box-shadow:0 18px 54px rgba(0,0,0,.46); font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-synthesis:none; }
    .mitre-context-popover.open { display:block; animation:mitre-pop-in .14s ease-out; }
    .mitre-context-popover::after { content:""; position:absolute; left:var(--arrow-left, 24px); bottom:-7px; width:12px; height:12px; border-right:1px solid var(--border-bright); border-bottom:1px solid var(--border-bright); background:var(--surface); transform:rotate(45deg); }
    .mitre-context-popover.below::after { top:-7px; bottom:auto; transform:rotate(225deg); }
    .mitre-context-head { display:flex; justify-content:space-between; gap:14px; padding:15px 16px 12px; border-bottom:1px solid var(--border); }
    .mitre-context-kind { color:var(--accent); font:700 10px 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.1em; }
    .mitre-context-title { margin-top:4px; color:var(--text-strong); font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size:1.02rem; font-weight:700; line-height:1.35; letter-spacing:0; }
    .mitre-context-close { align-self:flex-start; border:0; border-radius:8px; background:var(--surface-2); color:var(--text-muted); width:30px; height:30px; cursor:pointer; font-size:18px; line-height:1; }
    .mitre-context-close:hover, .mitre-context-close:focus { color:var(--text-strong); outline:1px solid var(--border-bright); }
    .mitre-context-label { padding:13px 16px 0; color:var(--text-muted); font:700 10px 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.08em; }
    .mitre-context-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px 0; }
    .mitre-context-toolbar .mitre-context-label { padding:0; }
    .mitre-context-toggle { display:none; border:1px solid var(--border); border-radius:8px; padding:6px 9px; background:var(--surface-2); color:var(--accent); font:700 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; cursor:pointer; }
    .mitre-context-toggle.visible { display:inline-flex; }
    .mitre-context-toggle:hover, .mitre-context-toggle:focus { border-color:var(--border-bright); color:var(--text-strong); outline:none; }
    .mitre-context-body { padding:8px 16px 16px; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size:.94rem; font-weight:400; line-height:1.58; letter-spacing:0; white-space:pre-line; max-height:min(360px, 48vh); overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; touch-action:pan-y; }
    .mitre-context-help { padding:0 16px 13px; color:var(--text-muted); font-size:.76rem; }
    @keyframes mitre-pop-in { from { opacity:0; transform:translateY(5px) scale(.98); } to { opacity:1; transform:none; } }
    @media (max-width:600px) { .mitre-context-popover { width:calc(100vw - 20px); } }
</style>
<aside class="mitre-context-popover" id="mitre-context-popover" role="dialog" aria-modal="false" aria-labelledby="mitre-context-title">
    <div class="mitre-context-head">
        <div><div class="mitre-context-kind" id="mitre-context-kind"></div><div class="mitre-context-title" id="mitre-context-title"></div></div>
        <button class="mitre-context-close" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="mitre-context-toolbar"><div class="mitre-context-label" id="mitre-context-label">Descripción</div><button class="mitre-context-toggle" id="mitre-context-toggle" type="button">Mostrar original</button></div>
    <div class="mitre-context-body" id="mitre-context-body"></div>
    <div class="mitre-context-help">Presioná Esc o hacé clic fuera de esta tarjeta para cerrarla.</div>
</aside>
<script>
(() => {
    const popover = document.getElementById('mitre-context-popover');
    if (!popover) return;
    const margin = 10;
    const body = document.getElementById('mitre-context-body');
    const label = document.getElementById('mitre-context-label');
    const toggle = document.getElementById('mitre-context-toggle');
    let originalDescription = '';
    let translatedDescription = '';
    let showingOriginal = false;
    const close = () => popover.classList.remove('open', 'below');
    const position = (x, y) => {
        popover.style.visibility = 'hidden';
        popover.classList.add('open');
        const box = popover.getBoundingClientRect();
        const left = Math.max(margin, Math.min(x - 28, window.innerWidth - box.width - margin));
        const fitsAbove = y - box.height - 12 >= margin;
        const top = fitsAbove ? y - box.height - 12 : Math.min(y + 12, window.innerHeight - box.height - margin);
        popover.classList.toggle('below', !fitsAbove);
        popover.style.left = `${left}px`;
        popover.style.top = `${Math.max(margin, top)}px`;
        popover.style.setProperty('--arrow-left', `${Math.max(16, Math.min(x - left - 6, box.width - 28))}px`);
        popover.style.visibility = 'visible';
    };
    const open = (target, x, y) => {
        document.getElementById('mitre-context-kind').textContent = target.dataset.contextKind || 'MITRE';
        document.getElementById('mitre-context-title').textContent = target.dataset.contextTitle || '';
        originalDescription = target.dataset.contextOriginal || '';
        translatedDescription = target.dataset.contextTranslation || '';
        showingOriginal = false;
        body.textContent = translatedDescription || originalDescription || 'La descripción todavía no está disponible. Ejecutá la sincronización completa de MITRE para descargarla.';
        label.textContent = translatedDescription ? 'Descripción en castellano' : 'Descripción oficial';
        toggle.classList.toggle('visible', Boolean(translatedDescription && originalDescription));
        toggle.textContent = 'Mostrar original';
        position(x, y);
    };
    toggle.addEventListener('click', () => {
        showingOriginal = !showingOriginal;
        body.textContent = showingOriginal ? originalDescription : translatedDescription;
        label.textContent = showingOriginal ? 'Descripción original · Inglés' : 'Descripción en castellano';
        toggle.textContent = showingOriginal ? 'Mostrar traducción' : 'Mostrar original';
        body.scrollTop = 0;
    });
    document.addEventListener('contextmenu', event => {
        const target = event.target.closest('.mitre-context-target');
        if (!target) return;
        event.preventDefault();
        event.stopPropagation();
        open(target, event.clientX, event.clientY);
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') close();
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.mitre-context-target:not(a)')) {
            event.preventDefault();
            const box = event.target.getBoundingClientRect();
            open(event.target, box.left + Math.min(box.width / 2, 80), box.top);
        }
    });
    document.addEventListener('click', event => { if (!popover.contains(event.target)) close(); });
    popover.querySelector('.mitre-context-close').addEventListener('click', close);
    window.addEventListener('resize', close);
    document.addEventListener('scroll', event => { if (!popover.contains(event.target)) close(); }, true);
})();
</script>
