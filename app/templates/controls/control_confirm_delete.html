{% extends "base.html" %}

{% block content %}
<main class="container">
    <section class="page-shell">
        <form method="post" class="panel">
            {% csrf_token %}
            <h1 class="page-title">Eliminar control</h1>
            <p class="page-subtitle">Vas a eliminar {{ item.code }} - {{ item.name }}.</p>
            <div class="form-actions" style="margin-top:16px;">
                <a class="btn" href="{% url 'control_detail' item.pk %}">Cancelar</a>
                <button class="btn-danger" type="submit">Eliminar</button>
            </div>
        </form>
    </section>
</main>
{% endblock %}
