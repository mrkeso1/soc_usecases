{% extends "base_bootstrap.html" %}

{% block title %}Eliminar control - SOC Control Manager{% endblock %}

{% block content %}
<main class="container-xxl py-4 px-3 px-lg-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-xl-6">
            <form method="post" class="card border-danger shadow-sm">
                {% csrf_token %}
                <div class="card-body p-3 p-lg-4">
                    <h1 class="page-title">Eliminar control</h1>
                    <p class="page-subtitle mb-0">Vas a eliminar {{ item.code }} - {{ item.name }}.</p>
                </div>
                <div class="card-footer bg-transparent d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 p-3 p-lg-4">
                    <a class="btn btn-outline-secondary" href="{% url 'control_detail' item.pk %}">Cancelar</a>
                    <button class="btn btn-danger" type="submit">Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
